# Konfigurimi për Render (render.com), plani FALAS, pa kartë.
# Të dhënat ruhen te Neon (Postgres falas): vendos DATABASE_URL te Environment.
services:
  - type: web
    name: unblej
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: PAYPAL_ENV
        value: live
      # Client ID e PayPal është publike (shfaqet edhe në faqe). Secret, nëse e shton, vendoset vetëm te Render.
      - key: PAYPAL_CLIENT_ID
        value: BAAqMo787obOl9KpEOJkM-bJ5TbfsJfzEVXWc4_5ziyeoB11tbZLRnKEImU-NhtGxzPWCSCqussvbT3AHY
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: SITE_URL
        sync: false
      - key: SUPPORT_EMAIL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
